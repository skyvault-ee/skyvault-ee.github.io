<header class="site-shell pt-10 pb-12 md:pt-14 md:pb-14 lg:pt-16">
  <div class="mb-8 flex items-center justify-between gap-6">
    <p class="flex items-center gap-3 text-sm font-medium">
      <span class="h-2 w-2 rounded-full bg-brand" aria-hidden="true"></span>
      {{ t.hero.kicker }}
    </p>

  </div>
  <h1 class="hero-heading font-medium tracking-tight">
    {{ t.hero.heading_line1 }}<br>
    <span class="text-brand">{{ t.hero.heading_line2 }}.</span>
  </h1>
  <div class="mt-8 grid items-end gap-8 lg:grid-cols-12 lg:gap-12">
    <p class="max-w-2xl text-base leading-relaxed text-muted md:text-lg lg:col-span-7">{{ t.hero.sub }}</p>
    <div class="flex flex-wrap items-center gap-x-7 gap-y-4 lg:col-span-5 lg:justify-end">
      <a href="#contact" class="button-primary">{{ t.hero.cta_contact }} {% include arrow.html %}</a>
      <a href="#portfolio" class="text-link">{{ t.hero.cta_work }} <span aria-hidden="true">↓</span></a>
    </div>
  </div>
</header>
