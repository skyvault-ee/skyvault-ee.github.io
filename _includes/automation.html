<section id="automation" class="automation-section section-space" aria-labelledby="automation-heading">
  <div class="site-shell">
    <div class="grid grid-cols-1 gap-8 xl:grid-cols-12 xl:gap-12">
      <div class="xl:col-span-5">
        <h2 id="automation-heading" class="section-heading">{{ t.training.block2.title }}</h2>
        <p class="mt-5 text-base leading-relaxed text-muted">{{ t.training.block2.lead }}</p>
        <a href="#contact" class="text-link mt-5">{{ t.hero.cta_contact }}</a>
      </div>
      <ul class="automation-list grid grid-cols-1 gap-x-8 gap-y-6 sm:grid-cols-2 xl:col-span-7">
        {% for item in t.training.block2.items %}
        <li class="text-base leading-relaxed text-muted"><span class="automation-check" aria-hidden="true">✓</span>{{ item.text }}</li>
        {% endfor %}
      </ul>
    </div>
    <div class="automation-example mt-9 flex items-center gap-5 sm:gap-8">
      <span class="document-mark shrink-0" aria-hidden="true">PDF</span>
      <p class="max-w-3xl text-lg leading-relaxed text-ink">{{ t.training.block2.example }}</p>
    </div>
  </div>
</section>
