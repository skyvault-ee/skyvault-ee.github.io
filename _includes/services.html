<section id="services" class="border-t border-line bg-white py-16 md:py-24" aria-labelledby="services-heading">
  <div class="site-shell grid gap-10 lg:grid-cols-12 lg:gap-16">
    <div class="lg:col-span-4">
      <span class="font-mono text-xs text-muted" aria-hidden="true">02 /</span>
      <h2 id="services-heading" class="section-heading mt-6">{{ t.services.heading }}.</h2>
      <p class="mt-6 max-w-sm text-base leading-relaxed text-muted">{{ t.services.subheading }}</p>
    </div>
    <div class="lg:col-span-8">
      {% for item in t.services.items %}
      <article class="grid gap-4 border-t border-line py-7 first:border-ink md:grid-cols-12 md:gap-8 md:py-8">
        <h3 class="text-xl font-semibold tracking-tight md:col-span-5 md:text-2xl">{{ item.title }}</h3>
        <p class="text-base leading-relaxed text-muted md:col-span-7">{{ item.text }}</p>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
