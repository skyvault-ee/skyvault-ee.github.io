<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% seo %}
    <meta name="twitter:card" content="summary_large_image">

    <!-- One page per language, cross-linked. x-default points at English. -->
    {% for l in site.data.languages %}
    <link rel="alternate" hreflang="{{ l.hreflang }}" href="{{ site.url }}{{ l.url | prepend: site.baseurl }}">
    {% endfor %}
    <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ site.baseurl }}/">

    {% if page.layout == 'send_cv' %}
    <!-- Keep the unlinked legacy application form independent of the homepage. -->
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/js/jquery-ui.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/font-awesome/css/font-awesome.min.css' | relative_url }}">
    {% else %}
    <link rel="preload" href="{{ '/assets/fonts/manrope-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=20260912">
    {% endif %}

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="144x144" href="/img/fav/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/fav/favicon-16x16.png">
    <link rel="manifest" href="/img/fav/site.webmanifest">
    <link rel="mask-icon" href="/img/fav/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#f7f7f2">
</head>
