<section id="contact">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">{{ t.contact.heading }}</h2>
                    <h3 class="section-subheading text-muted">{{ t.contact.subheading }}</h3>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    {%- comment -%}
                      contact_me.js reads its user-facing strings from these data
                      attributes so the failure and success messages stay in the
                      page's language instead of being hardcoded English in JS.
                    {%- endcomment -%}
                    <form name="sentMessage" id="contactForm" novalidate
                          data-msg-success="{{ t.contact.js_success }}"
                          data-msg-invalid-lead="{{ t.contact.js_invalid_lead }}"
                          data-msg-invalid-advice="{{ t.contact.js_invalid_advice }}"
                          data-msg-fail-lead="{{ t.contact.js_fail_lead }}"
                          data-msg-fail-advice="{{ t.contact.js_fail_advice }}"
                          data-msg-offline-lead="{{ t.contact.js_offline_lead }}"
                          data-msg-offline-advice="{{ t.contact.js_offline_advice }}">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="control-group form-group">
                                    <input type="text" class="form-control" placeholder="{{ t.contact.name }}" id="name" required data-validation-required-message="{{ t.contact.err_name }}">
                                    <p class="help-block text-danger"></p>
                                </div>
                                <div class="control-group form-group">
                                    <input type="email" class="form-control" placeholder="{{ t.contact.email }}" id="email" required data-validation-required-message="{{ t.contact.err_email }}">
                                    <p class="help-block text-danger"></p>
                                </div>
                                <div class="control-group form-group">
                                    <input type="tel" class="form-control" placeholder="{{ t.contact.phone }}" id="phone" required data-validation-required-message="{{ t.contact.err_phone }}">
                                    <p class="help-block text-danger"></p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="control-group form-group">
                                    <textarea class="form-control" placeholder="{{ t.contact.message }}" id="message" required data-validation-required-message="{{ t.contact.err_message }}"></textarea>
                                    <p class="help-block text-danger"></p>
                                </div>
                            </div>
                            <div class="clearfix"></div>
                            <div class="col-lg-12 text-center">
                                <div id="success"></div>
                                <button type="submit" class="btn btn-xl">{{ t.contact.submit }}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
