<section id="contact" class="site-shell section-space" aria-labelledby="contact-heading">
  <div class="grid grid-cols-1 gap-8 xl:grid-cols-12 xl:gap-12">
    <div class="xl:col-span-4">
      <h2 id="contact-heading" class="section-heading">{{ t.contact.heading }}</h2>
      <p class="mt-6 max-w-sm text-base leading-relaxed text-muted">{{ t.contact.subheading }}</p>
    </div>
    <form name="sentMessage" id="contactForm" class="xl:col-span-8" action="https://skyvault.dopice.sk/contact_me.php" method="post"
          data-msg-success="{{ t.contact.js_success | escape }}"
          data-msg-invalid-lead="{{ t.contact.js_invalid_lead | escape }}"
          data-msg-invalid-advice="{{ t.contact.js_invalid_advice | escape }}"
          data-msg-fail-lead="{{ t.contact.js_fail_lead | escape }}"
          data-msg-fail-advice="{{ t.contact.js_fail_advice | escape }}"
          data-msg-offline-lead="{{ t.contact.js_offline_lead | escape }}"
          data-msg-offline-advice="{{ t.contact.js_offline_advice | escape }}"
          data-msg-sending="{{ t.ui.sending | escape }}">
      <div class="grid gap-x-6 gap-y-7 sm:grid-cols-2">
        <div><label class="field-label" for="name">{{ t.contact.name }}</label><input class="form-field" type="text" id="name" name="name" autocomplete="name" required maxlength="200" data-error="{{ t.contact.err_name | escape }}"></div>
        <div><label class="field-label" for="email">{{ t.contact.email }}</label><input class="form-field" type="email" id="email" name="email" autocomplete="email" required maxlength="254" data-error="{{ t.contact.err_email | escape }}"></div>
        <div class="sm:col-span-2"><label class="field-label" for="phone">{{ t.contact.phone }}</label><input class="form-field" type="tel" id="phone" name="phone" autocomplete="tel" required maxlength="60" data-error="{{ t.contact.err_phone | escape }}"></div>
        <div class="sm:col-span-2"><label class="field-label" for="message">{{ t.contact.message }}</label><textarea class="form-field min-h-32 resize-y" id="message" name="message" rows="4" required maxlength="10000" data-error="{{ t.contact.err_message | escape }}"></textarea></div>
      </div>
      <div id="success" class="form-status" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="mt-7 flex flex-wrap items-center justify-between gap-5">
        <p class="text-xs text-muted">{{ t.ui.required }}</p>
        <button type="submit" class="button-primary"><span data-submit-label>{{ t.contact.submit }}</span></button>
      </div>
    </form>
  </div>
</section>
