# traducido. Las claves deben coincidir con _data/i18n/en.yml.

meta:
  title: Desarrollo de software, e-commerce y DevOps
  description: >-
    Skyvault construye y mantiene software en producción — tiendas online,
    aplicaciones a medida y la infraestructura que hay debajo. También formamos
    equipos en el uso de agentes de IA y automatizamos trabajo repetitivo.
    Empresa estonia, equipo en la UE.

nav:
  services: Servicios
  training: Formación en IA
  portfolio: Proyectos
  contact: Contacto
  language: Idioma

hero:
  kicker: Empresa de software · Estonia
  heading_line1: Software que tiene que
  heading_line2: funcionar el lunes
  sub: >-
    Construimos y mantenemos sistemas en producción para empresas reales —
    tiendas online, herramientas internas y los servidores que hay debajo.
    Equipo pequeño, sin gestores de cuenta, sin cola de tickets.
  cta_work: Ver nuestro trabajo
  cta_contact: Hablemos

services:
  heading: Qué hacemos
  subheading: >-
    Equipo pequeño, sin gestores de cuenta. Hablas directamente con quienes
    escriben el código.
  items:
    - icon: fa-shopping-cart
      title: Web y e-commerce
      text: >-
        Tiendas y webs corporativas que tienen que funcionar de verdad:
        catálogos de producto, importación de listas de proveedores, pedidos,
        facturas y correo que llega a la bandeja de entrada y no al spam.
    - icon: fa-code
      title: Software a medida
      text: >-
        Herramientas internas, integraciones y ese asunto incómodo que ningún
        producto de catálogo resuelve. Elegimos los proyectos donde lo
        interesante es el problema, no el framework.
    - icon: fa-server
      title: DevOps y hosting
      text: >-
        Despliegues, configuración de servidores, migraciones de base de datos y
        el correo que dejó de enviarse. La mitad ingrata de la que depende que
        todo lo demás siga en pie.

training:
  heading: Formación en IA y automatización
  subheading: >-
    Usamos agentes de IA todos los días en trabajo real para clientes. Enseñamos
    a tu equipo a hacer lo mismo — y eliminamos el trabajo repetitivo que se
    está comiendo vuestra semana sin que nadie lo note.
  block1:
    title: Formar a tu equipo
    lead: >-
      Sesiones prácticas sobre vuestro propio repositorio y vuestras propias
      tareas. Nada de diapositivas sobre el futuro de la IA.
    items:
      - strong: Claude y Claude Code
        text: >-
          — cómo conseguir que un agente haga trabajo real sobre código real, no
          que se limite a responder preguntas.
      - strong: Codex y OpenCode
        text: >-
          — las alternativas, en qué es bueno cada uno y cuándo merece la pena
          cambiar.
      - strong: Prompts, instrucciones de proyecto y contexto
        text: que sobrevivan al contacto con un repositorio desordenado.
      - strong: Revisar lo que ha producido el agente
        text: >-
          — qué comprobar antes de fusionar, desplegar o enviarlo a un cliente.
      - strong: Modelos en vuestro propio hardware
        text: cuando los datos no pueden salir de la empresa.
  block2:
    title: Automatizar el trabajo repetitivo
    lead: >-
      Casi toda empresa tiene un puñado de tareas que alguien rehace cada
      semana, porque nunca nadie se sentó a eliminarlas. Nosotros las
      encontramos y las eliminamos.
    items:
      - text: >-
          Primero decidir qué merece la pena automatizar — buena parte de ello
          no lo merece.
      - text: >-
          Agentes conectados a las herramientas que ya pagáis: correo, hojas de
          cálculo, facturación, vuestra tienda, vuestros servidores.
      - text: >-
          Tareas programadas que hacen la pasada aburrida y solo avisan cuando
          algo no cuadra.
      - text: >-
          Entrega: vive en vuestro repositorio, documentado, y sigue funcionando
          aunque no volváis a llamarnos.
    example: >-
      Cada lunes por la mañana llega la lista de precios del proveedor en PDF.
      Nadie debería estar copiándola a mano en la tienda.
  price:
    unit: / hora
    vat: IVA no incluido
    terms:
      - En remoto, o presencial en Eslovaquia, Chequia, Polonia, Estonia y Paraguay.
      - Las sesiones parten de una hora. Un primer taller útil suele durar media jornada.
      - Impartida en español, inglés o eslovaco.
      - Empresa estonia — a empresas de la UE se factura con inversión del sujeto pasivo.
    cta: Reservar una sesión

