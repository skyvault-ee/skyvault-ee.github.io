services:
  heading: Web, diseño y sistemas para empresas
  subheading: >-
    Un mismo equipo para la web que ven tus clientes, la identidad de tu marca y
    el trabajo que viene después del lanzamiento.
  items:
    - icon: fa-shopping-cart
      title: Webs para empresas y tiendas online
      text: >-
        Webs corporativas y tiendas online pensadas para cómo trabaja tu empresa:
        servicios claros, catálogos útiles, listas de proveedores, pedidos,
        facturas y correos que llegan a la bandeja de entrada.
    - icon: fa-code
      title: Logotipos e identidad visual
      text: >-
        Diseño de logotipo, identidad visual y recursos prácticos para tu web y
        tus redes. Una imagen coherente y pautas para usarla, no solo un archivo
        con el logo.
    - icon: fa-search
      title: Auditorías SEO
      text: >-
        Revisamos el SEO técnico, el contenido de las páginas, los resultados de
        búsqueda y las páginas de entrada. Recibes una lista de mejoras por
        prioridad, no una promesa de aparecer primero.
    - icon: fa-code
      title: Software a medida
      text: >-
        Herramientas internas, integraciones y ese asunto incómodo que ningún
        producto de catálogo resuelve. Elegimos los proyectos donde lo
        interesante es el problema, no el framework.
    - icon: fa-server
      title: DevOps y hosting
      text: >-
        Despliegues, configuración de servidores, migraciones de base de datos y
        el correo que dejó de enviarse. La mitad ingrata de la que depende que
        todo lo demás siga en pie.
    - icon: fa-share-alt
      title: Marketing con IA y publicación en redes
      text: >-
        Flujos de marketing con ayuda de IA y publicación automática en Instagram
        y Facebook. Prepara, revisa y programa vídeos, Stories y publicaciones
        desde un mismo flujo de contenido.

training:
  heading: Formación en IA y automatización
  subheading: >-
    Usamos agentes de IA todos los días en trabajo real para clientes. Le
    enseñamos a tu equipo a hacer lo mismo y te quitamos de encima el trabajo
    repetitivo que se come la semana sin que nadie se dé cuenta.
  block1:
    title: Formar a tu equipo
    lead: >-
      Sesiones prácticas sobre tu propio proyecto y tus propias tareas. Nada
      de diapositivas sobre el futuro de la IA.
    items:
      - strong: Claude y Claude Code
        text: >-
          cómo sacar adelante tareas reales en un proyecto real, y no solo
          obtener respuestas a preguntas.
      - strong: Codex y OpenCode
        text: en qué es bueno cada uno y cuándo compensa cambiar.
      - strong: Prompts, instrucciones de proyecto y contexto
        text: escritos para que funcionen incluso en un proyecto desordenado.
      - strong: Revisar lo que ha hecho el agente
        text: >-
          qué comprobar antes de fusionar, desplegar o mandárselo a un cliente.
      - strong: Modelos en tu propio hardware
        text: para cuando los datos no pueden salir de la empresa.
  block2:
    title: Marketing con IA y el trabajo que lo rodea
    lead: >-
      La IA puede ayudar con el marketing, pero el contenido necesita un camino
      fiable desde el borrador hasta la aprobación y la publicación. Montamos
      ese flujo y quitamos trabajo repetitivo de encima a tu equipo.
    items:
      - text: >-
          Primero vemos qué compensa automatizar. Bastantes cosas no compensan.
      - text: >-
          Agentes conectados a las herramientas que ya pagas: correo, hojas de
          cálculo, facturación, tu tienda, tus servidores.
      - text: >-
          Tareas programadas que se encargan de la parte aburrida y solo avisan
          cuando algo no cuadra.
      - text: >-
          Flujos con IA que ayudan a preparar y adaptar textos, con revisión
          humana antes de publicarlos.
      - text: >-
          Publica automáticamente vídeos, Stories y publicaciones compatibles en
          Instagram y Facebook. Antes comprobamos los requisitos de la cuenta y
          del formato.
      - text: >-
          Entrega: queda en tu proyecto, documentado, y sigue funcionando
          aunque no vuelvas a llamarnos.
    example: >-
      Cada lunes por la mañana llega la lista de precios del proveedor en PDF.
      Nadie debería estar pasándola a mano a la tienda.
  price:
    unit: / hora
    terms:
      - En remoto, o presencial en Eslovaquia, Chequia, Polonia, Estonia y Paraguay.
      - Desde una hora. Un primer taller que sirva de algo suele ocupar media jornada.
      - En español, inglés o eslovaco.
    cta: Reservar una sesión

