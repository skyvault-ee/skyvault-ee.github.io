# Proyectos. La clave es el `modal-id` de la entrada. Título, imágenes, cliente,
# stack y fechas quedan en el front matter, solo se traduce el texto.
work:
  "1":
    subtitle: E-commerce para un proveedor de piedra natural
    category: E-commerce
    description: >-
      Una tienda online para un proveedor de piedra natural: travertino,
      mármol, andesita, arenisca, adoquines. El catálogo se alimenta de una
      importación automática del feed del proveedor, así que cientos de
      productos y sus variantes se mantienen al día sin que nadie recopie una
      lista de precios. El precio se calcula por metro cuadrado o por pieza
      según el material, el checkout emite facturas en regla en lugar de cobrar
      con tarjeta, y el correo transaccional va firmado con DKIM para que las
      confirmaciones de pedido lleguen de verdad al cliente.
  "2":
    subtitle: Presentación de inversión inmobiliaria
    category: Desarrollo web
    description: >-
      Un sitio de presentación de apartamentos nuevos en el complejo Gino
      Paradise de Bešeňová, dirigido a compradores que los valoraban como
      inversión y no como vivienda. El centro de la página era una calculadora
      de rentabilidad que convertía la oferta (rentabilidad garantizada, días
      de estancia del propietario, duración del contrato) en una cifra con la
      que un inversor podía echar cuentas de verdad. Entregado en 2019, el
      cliente ha sustituido el sitio desde entonces.
