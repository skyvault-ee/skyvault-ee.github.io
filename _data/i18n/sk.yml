services:
  heading: Weby, dizajn a systémy pre firmy
  subheading: >-
    Jeden tím pre web, ktorý vidia vaši zákazníci, značku, ktorú nesie, aj prácu
    po jeho spustení.
  items:
    - icon: fa-shopping-cart
      title: Firemné weby a e-shopy
      text: >-
        Firemné weby a e-shopy postavené podľa toho, ako vaša firma funguje:
        zrozumiteľné stránky služieb, užitočné katalógy, importy od dodávateľov,
        objednávky, faktúry a e-maily, ktoré dorazia do schránky.
    - icon: fa-code
      title: Logá a vizuálna identita
      text: >-
        Návrh loga, vizuálnej identity a podkladov pre web aj sociálne siete.
        Jednotný vzhľad a pravidlá používania, nie iba súbor s logom.
    - icon: fa-search
      title: SEO audity
      text: >-
        Skontrolujeme technické SEO, obsah stránok, zobrazenie vo výsledkoch
        vyhľadávania aj stránky, na ktoré ľudia prichádzajú. Dostanete zoznam
        úprav podľa prínosu, nie sľub prvej pozície.
    - icon: fa-code
      title: Softvér na mieru
      text: >-
        Interné nástroje, integrácie a tá nepríjemná vec, na ktorú neexistuje
        hotové riešenie. Berieme projekty, kde je zaujímavý problém, nie
        framework.
    - icon: fa-server
      title: DevOps a hosting
      text: >-
        Nasadenia, konfigurácie serverov, migrácie databáz a pošta, ktorá
        prestala odchádzať. Nevďačná polovica, od ktorej závisí, či všetko
        ostatné beží.
    - icon: fa-share-alt
      title: AI marketing a publikovanie na sociálne siete
      text: >-
        Marketingové postupy s podporou AI a automatické publikovanie na
        Instagrame a Facebooku. Videá, príbehy a príspevky pripravíte, skontrolujete
        a naplánujete v jednom procese.

training:
  heading: AI školenia a automatizácia
  subheading: >-
    AI agentov používame každý deň na skutočných zákazkách. Naučíme to aj váš
    tím a zbavíme vás opakovanej roboty, na ktorej vám potichu odchádza čas.
  block1:
    title: Školenie vášho tímu
    lead: >-
      Praktické školenie priamo na vašom projekte a vašich úlohách. Žiadna
      prezentácia o budúcnosti AI.
    items:
      - strong: Claude a Claude Code
        text: >-
          ako z agenta dostať skutočnú prácu v reálnom kóde, nie len odpovede
          na otázky.
      - strong: Codex a OpenCode
        text: v čom je ktorý dobrý a kedy sa oplatí prepnúť.
      - strong: Prompty, inštrukcie k projektu a kontext
        text: napísané tak, aby vydržali aj tam, kde je v kóde poriadny neporiadok.
      - strong: Kontrola toho, čo agent napísal
        text: >-
          čo si overiť predtým, než sa to zlúči, nasadí alebo pošle zákazníkovi.
      - strong: Modely na vlastnom hardvéri
        text: pre prípady, keď dáta nesmú opustiť firmu.
  block2:
    title: AI marketing a práca okolo neho
    lead: >-
      AI môže pomôcť s marketingom, no obsah stále potrebuje spoľahlivú cestu od
      návrhu cez schválenie až po publikovanie. Nastavíme ju a odbremeníme tím od
      opakovanej práce.
    items:
      - text: >-
          Najskôr zistíme, čo sa vôbec oplatí automatizovať. Dosť veľa vecí sa
          neoplatí.
      - text: >-
          Agenti napojení na nástroje, ktoré už aj tak platíte: pošta, tabuľky,
          fakturácia, váš e-shop, vaše servery.
      - text: >-
          Naplánované úlohy, ktoré odrobia tú nudnú časť a ozvú sa, len keď
          niečo nesedí.
      - text: >-
          Postupy s podporou AI pomôžu pripraviť a upraviť texty, ktoré pred
          zverejnením skontroluje človek.
      - text: >-
          Automatické publikovanie podporovaných videí, príbehov a príspevkov na
          Instagram a Facebook. Vopred overíme podmienky účtu a formátu.
      - text: >-
          Odovzdanie: všetko ostáva vo vašom projekte, zdokumentované, a beží
          ďalej, aj keby ste nám už nikdy nezavolali.
    example: >-
      Každý pondelok ráno príde od dodávateľa cenník v PDF. Nikto by ho nemal
      ručne prepisovať do e-shopu.
  price:
    unit: / hodina
    terms:
      - Online, alebo osobne na Slovensku, v Česku, Poľsku, Estónsku a Paraguaji.
      - Školenie od jednej hodiny. Prvý workshop má zmysel aspoň na pol dňa.
      - Vedieme ich po slovensky alebo po anglicky.
    cta: Objednať školenie

