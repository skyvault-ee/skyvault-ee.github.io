# nie ako preložená angličtina. Kľúče musia zodpovedať _data/i18n/en.yml.

meta:
  title: Vývoj softvéru, e-commerce a DevOps
  description: >-
    Skyvault stavia a prevádzkuje produkčný softvér — e-shopy, aplikácie na
    mieru a infraštruktúru pod nimi. Školíme tímy v práci s AI agentmi a
    automatizujeme opakovanú prácu. Estónska firma, tím v EÚ.

nav:
  services: Služby
  training: AI školenia
  portfolio: Referencie
  contact: Kontakt
  language: Jazyk

hero:
  kicker: Softvérová firma · Estónsko
  heading_line1: Softvér, ktorý musí
  heading_line2: fungovať v pondelok
  sub: >-
    Staviame a prevádzkujeme produkčné systémy pre reálne firmy — e-shopy,
    interné nástroje a servery pod nimi. Malý tím, žiadni account manažéri,
    žiadny tiketový systém.
  cta_work: Pozrite si našu prácu
  cta_contact: Napíšte nám

services:
  heading: Čo robíme
  subheading: >-
    Malý tím, žiadni account manažéri. Bavíte sa priamo s ľuďmi, ktorí píšu kód.
  items:
    - icon: fa-shopping-cart
      title: Web a e-commerce
      text: >-
        E-shopy a firemné weby, ktoré musia fungovať naostro: katalógy
        produktov, importy od dodávateľov, objednávky, faktúry a e-maily, ktoré
        prídu do schránky a nie do spamu.
    - icon: fa-code
      title: Softvér na mieru
      text: >-
        Interné nástroje, integrácie a tá nepríjemná vec, na ktorú neexistuje
        hotové riešenie. Berieme projekty, kde je zaujímavý problém, nie
        framework.
    - icon: fa-server
      title: DevOps a hosting
      text: >-
        Nasadenia, konfigurácie serverov, migrácie databáz a pošta, ktorá
        prestala odchádzať. Nevďačná polovica, od ktorej závisí, či všetko
        ostatné beží.

training:
  heading: AI školenia a automatizácia
  subheading: >-
    AI agentov používame každý deň na reálnej práci pre klientov. Naučíme to aj
    váš tím — a zbavíme vás opakovanej roboty, ktorá vám potichu žerie týždeň.
  block1:
    title: Školenie vášho tímu
    lead: >-
      Praktické sedenia na vašom vlastnom repozitári a vašich úlohách. Žiadna
      prezentácia o budúcnosti AI.
    items:
      - strong: Claude a Claude Code
        text: >-
          — ako donútiť agenta robiť skutočnú prácu v reálnom kóde, nie len
          odpovedať na otázky.
      - strong: Codex a OpenCode
        text: >-
          — alternatívy, v čom je každá dobrá a kedy sa oplatí prepnúť.
      - strong: Prompty, inštrukcie k projektu a kontext
        text: ktoré prežijú stret s neupratným repozitárom.
      - strong: Kontrola toho, čo agent vyrobil
        text: >-
          — čo si overiť predtým, než sa to zlúči, nasadí alebo pošle
          zákazníkovi.
      - strong: Modely na vlastnom hardvéri
        text: keď dáta nesmú opustiť firmu.
  block2:
    title: Automatizácia opakovanej práce
    lead: >-
      Väčšina firiem má pár úloh, ktoré niekto každý týždeň robí odznova, lebo
      si nikdy nikto nesadol a nezrušil ich. Tie nájdeme a zrušíme.
    items:
      - text: >-
          Najskôr zistíme, čo sa vôbec oplatí automatizovať — poriadny kus
          toho sa neoplatí.
      - text: >-
          Agenti napojení na nástroje, ktoré už platíte: pošta, tabuľky,
          fakturácia, váš e-shop, vaše servery.
      - text: >-
          Naplánované úlohy, ktoré odrobia nudný prechod a ozvú sa len vtedy,
          keď niečo nesedí.
      - text: >-
          Odovzdanie: všetko žije vo vašom repozitári, zdokumentované, a beží
          ďalej, aj keby ste nám už nikdy nezavolali.
    example: >-
      Každý pondelok ráno príde cenník od dodávateľa v PDF. Nikto by ho nemal
      prepisovať do e-shopu ručne.
  price:
    unit: / hodina
    vat: Bez DPH
    terms:
      - Online, alebo osobne na Slovensku, v Česku, Poľsku, Estónsku a Paraguaji.
      - Sedenia od jednej hodiny. Zmysluplný prvý workshop býva na pol dňa.
      - Vedieme ich po slovensky alebo po anglicky.
      - Estónska firma — firmám z EÚ fakturujeme v režime prenesenej daňovej povinnosti.
    cta: Objednať školenie

