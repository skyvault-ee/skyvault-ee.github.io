  description: >-
    Skyvault stavia a prevádzkuje softvér, ktorý firmám beží naostro: e-shopy,
    aplikácie na mieru a servery pod nimi. Školíme tímy v práci s AI agentmi a
    automatizujeme opakovanú prácu. Estónska firma, tím v EÚ.

