# Referencie. Kľúčom je `modal-id` z príspevku. Názov, obrázky, klient, stack
# a dátumy ostávajú vo front matter, prekladá sa len text.
work:
  "1":
    subtitle: E-shop pre dodávateľa prírodného kameňa
    category: E-commerce
    description: >-
      E-shop pre dodávateľa prírodného kameňa: travertín, mramor, andezit,
      pieskovec, dlažobné kocky. Katalóg ťahá automatický import feedu od
      dodávateľa, takže stovky produktov a ich variantov ostávajú aktuálne bez
      toho, aby niekto prepisoval cenník. Ceny sa rátajú za meter štvorcový
      alebo za kus podľa materiálu, objednávka vystaví riadnu faktúru namiesto
      platby kartou a transakčné e-maily sú podpísané cez DKIM, takže
      potvrdenia objednávok naozaj dorazia.
  "2":
    subtitle: Prezentácia investičnej nehnuteľnosti
    category: Vývoj webu
    description: >-
      Prezentačná stránka nových apartmánov v rezorte Gino Paradise v Bešeňovej,
      určená ľuďom, ktorí ich zvažovali ako investíciu, nie ako bývanie.
      Postavená okolo kalkulačky výnosu, ktorá ponuku (garantovaný výnos, dni
      pobytu pre majiteľa, dĺžka zmluvy) premenila na číslo, s ktorým vedel
      investor reálne počítať. Odovzdané v roku 2019, stránku odvtedy klient
      nahradil.
