hero:
  kicker: Websites, software & marketing automation · Estonia
  heading_line1: Websites and systems
  heading_line2: work on Monday
  sub: >-
    We make company websites, logos and brand identities. Then we help marketing
    keep moving with SEO audits, AI-assisted workflows and automatic publishing
    to Instagram and Facebook. Small team, no account managers, no ticket queue.
  cta_work: See our work
  cta_contact: Start a conversation

services:
  heading: Websites, design & the systems behind them
  subheading: >-
    One team for the website customers see, the identity it carries, and the work
    that happens after launch.
  items:
    - icon: fa-shopping-cart
      title: Company websites &amp; online shops
      text: >-
        Company websites and online shops built around how your business works:
        clear service pages, useful product catalogs, supplier feeds, orders,
        invoices, and transactional email that reaches the inbox.
    - icon: fa-code
      title: Logos &amp; brand identity
      text: >-
        Logo design, visual identity and practical design assets for your website
        and social channels. A consistent look, with guidance on how to use it,
        rather than a logo file on its own.
    - icon: fa-search
      title: SEO audits
      text: >-
        We check technical SEO, on-page content, search snippets and the pages
        visitors land on. You get a prioritized list of fixes, not a promise of
        overnight rankings.
    - icon: fa-code
      title: Custom software
      text: >-
        Internal tools, integrations and the awkward thing that no off-the-shelf
        product does. We take the projects where the interesting part is the
        problem, not the framework.
    - icon: fa-server
      title: DevOps &amp; hosting
      text: >-
        Deployments, server configs, database migrations, the mail that stopped
        sending. The unglamorous half that decides whether everything else stays
        up.
    - icon: fa-share-alt
      title: AI marketing &amp; social publishing
      text: >-
        AI-assisted marketing workflows and automatic publishing to Instagram
        and Facebook. Prepare, review and schedule supported videos, Stories and
        posts from one content workflow.

training:
  heading: AI training &amp; automation
  subheading: >-
    We run AI coding agents on real client work every day. We teach your team to
    do the same, and take away the repetitive work that quietly eats your week.
  block1:
    title: Training your team
    lead: >-
      Hands-on sessions on your own repository and your own tasks. Not a slide
      deck about the future of AI.
    items:
      - strong: Claude and Claude Code
        text: >-
          how to get real work out of an agent in a real codebase, not just
          answers to questions.
      - strong: Codex and OpenCode
        text: what each one is good at, and when it is worth switching.
      - strong: Prompts, project instructions and context
        text: written so they hold up in a repository that is a genuine mess.
      - strong: Reviewing what the agent produced
        text: >-
          what to check before anything gets merged, deployed or sent to a
          customer.
      - strong: Running models on your own hardware
        text: for when the data is not allowed to leave the building.
  block2:
    title: AI marketing and the work around it
    lead: >-
      AI can help with marketing, but content still needs a reliable path from
      draft to approval to publishing. We set up that workflow and take repetitive
      work off your team's plate.
    items:
      - text: >-
          Working out what is actually worth automating first. A fair amount of
          it is not.
      - text: >-
          Agents wired into the tools you already pay for: mail, spreadsheets,
          invoicing, your shop, your servers.
      - text: >-
          Scheduled jobs that do the boring pass and only speak up when
          something looks wrong.
      - text: >-
          AI-assisted content workflows that help prepare and adapt copy, with a
          human review before it goes out.
      - text: >-
          Automatically publish supported videos, Stories and posts to Instagram
          and Facebook. We check account and format requirements before setup.
      - text: >-
          Handover: it lives in your repository, documented, and it keeps
          working if you never call us again.
    example: >-
      A supplier price list arrives as a PDF every Monday morning. Nobody should
      be retyping it into the shop.
  price:
    unit: / hour
    terms:
      - Remote, or on-site in Slovakia, the Czech Republic, Poland, Estonia and Paraguay.
      - From one hour. A first workshop worth doing usually takes half a day.
      - Delivered in English or Slovak.
    cta: Book a session

