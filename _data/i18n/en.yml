# Portfolio entries. Keyed by the post's `modal-id`. Title, images, client,
# stack and dates stay in the post front matter, only prose is translated.
work:
  "1":
    subtitle: E-commerce for a natural stone supplier
    category: E-commerce
    description: >-
      An online shop for a natural stone supplier: travertine, marble,
      andesite, sandstone, paving cubes. The catalog is driven by an automated
      supplier feed import, so hundreds of products and their variants stay in
      sync without anyone retyping a price list. Pricing works per square metre
      or per piece depending on the material, checkout issues proper invoices
      instead of taking card payments, and transactional mail is DKIM-signed so
      order confirmations actually reach the customer.
  "2":
    subtitle: Property investment presentation
    category: Web Development
    description: >-
      A presentation site for new apartments in the Gino Paradise resort in
      Bešeňová, aimed at buyers weighing them up as an investment rather than a
      home. The centre of the page was a return calculator that turned the offer
      (guaranteed yield, owner stay days, contract length) into a number a
      prospective investor could actually work with. Delivered in 2019, the
      client has since replaced the site.
