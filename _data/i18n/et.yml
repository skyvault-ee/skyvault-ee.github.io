work:
  "1":
    subtitle: E-pood looduskivi tarnijale
    category: E-pood
    description: >-
      E-pood looduskivi tarnijale — travertiin, marmor, andesiit, liivakivi,
      sillutuskivid. Kataloogi taga on tarnija hinnakirja automaatne import, nii
      et sajad tooted ja nende variandid püsivad ajakohased ilma, et keegi peaks
      hinnakirja ümber trükkima. Hind arvutatakse olenevalt materjalist
      ruutmeetri või tüki kaupa, ostukorv väljastab kaardimakse asemel korraliku
      arve ja tehingukirjad on DKIM-allkirjastatud, nii et tellimuse kinnitused
      päriselt kliendini jõuavad.
  "2":
    subtitle: Kinnisvarainvesteeringu tutvustus
    category: Veebiarendus
    description: >-
      Tutvustusleht Gino Paradise kuurordi uutele korteritele Bešeňovás,
      suunatud ostjatele, kes kaalusid neid pigem investeeringu kui koduna.
      Selle keskmes oli tootluskalkulaator, mis muutis pakkumise — garanteeritud
      tootlus, omaniku ööbimispäevad, lepingu pikkus — arvuks, mida investor
      sai päriselt võrrelda. Üle antud 2019. aastal; klient on lehe vahepeal
      välja vahetanud.
