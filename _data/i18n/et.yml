services:
  heading: Veebilehed, disain ja ettevõtte süsteemid
  subheading: >-
    Üks tiim veebilehe, sellel nähtava brändi ja pärast käivitamist tehtava töö
    jaoks.
  items:
    - icon: fa-shopping-cart
      title: Ettevõtete veebilehed ja e-poed
      text: >-
        Ettevõtte veebilehed ja e-poed, mis lähtuvad teie äri toimimisest:
        selged teenuselehed, kasulikud tootekataloogid, tarnijate hinnakirjad,
        tellimused, arved ja e-kirjad, mis jõuavad postkasti.
    - icon: fa-code
      title: Logod ja brändiidentiteet
      text: >-
        Logo, brändiidentiteedi ja praktiliste kujundusmaterjalide loomine
        veebilehe ning sotsiaalmeedia jaoks. Ühtne ilme ja juhised selle
        kasutamiseks, mitte ainult logofail.
    - icon: fa-search
      title: SEO-auditid
      text: >-
        Vaatame üle tehnilise SEO, lehe sisu, otsingutulemuste väljanägemise ja
        lehed, kuhu külastajad jõuavad. Saate paranduste nimekirja mõjukuse
        järgi, mitte lubadust jõuda üleöö esimeseks.
    - icon: fa-code
      title: Eritellimustarkvara
      text: >-
        Sisemised töövahendid, liidestused ja see tüütu asi, mida ükski
        valmistoode ei lahenda. Võtame projekte, kus huvitav osa on probleem,
        mitte raamistik.
    - icon: fa-server
      title: DevOps ja hosting
      text: >-
        Juurutused, serverite seadistus, andmebaaside migratsioonid ja e-kiri,
        mis lakkas välja minemast. See tänamatu pool, millest sõltub, kas kõik
        ülejäänu üldse töötab.
    - icon: fa-share-alt
      title: AI-turundus ja sotsiaalmeedias avaldamine
      text: >-
        AI abil toetatud turundustöövood ja automaatne avaldamine Instagramis
        ning Facebookis. Valmistage videod, lood ja postitused ette, vaadake
        üle ning ajastage ühes sisutöövoos.

training:
  heading: AI-koolitus ja automatiseerimine
  subheading: >-
    Kasutame AI-agente iga päev päris klienditöös. Õpetame sama ka teie
    tiimile ja võtame ära korduva töö, mille peale kulub märkamatult terve
    nädal.
  block1:
    title: Teie tiimi koolitamine
    lead: >-
      Praktiline koolitus teie enda projekti ja ülesannetega.
      Mitte slaidiesitlus AI tulevikust.
    items:
      - strong: Claude ja Claude Code
        text: >-
          kuidas panna agent tegema päris tööd päris projektis, mitte lihtsalt
          küsimustele vastama.
      - strong: Codex ja OpenCode
        text: milles kumbki tugev on ja millal tasub vahetada.
      - strong: Promptid, projektijuhised ja kontekst
        text: kirjutatud nii, et need toimivad ka üsna segases projektis.
      - strong: Agendi töö ülevaatamine
        text: >-
          mida kontrollida enne, kui midagi liidetakse, juurutatakse või
          kliendile saadetakse.
      - strong: Mudelid teie enda riistvaral
        text: juhuks, kui andmed ei tohi majast välja liikuda.
  block2:
    title: AI-turundus ja sellega seotud töö
    lead: >-
      AI aitab turunduses, kuid sisul peab olema kindel tee mustandist kinnituse
      ja avaldamiseni. Seame töövoo üles ning võtame meeskonnalt korduva töö ära.
    items:
      - text: >-
          Kõigepealt selgitame välja, mida üldse tasub automatiseerida. Päris
          suur osa sellest ei tasu.
      - text: >-
          Agendid ühendatud töövahenditega, mille eest te niikuinii maksate:
          e-post, tabelid, arveldus, teie pood, teie serverid.
      - text: >-
          Ajastatud tööd, mis teevad selle igava osa ära ja annavad märku ainult
          siis, kui midagi on viltu.
      - text: >-
          AI-töövood aitavad tekste ette valmistada ja kohandada, inimene vaatab
          need enne avaldamist üle.
      - text: >-
          Avaldage toetatud videod, lood ja postitused Instagramis ning
          Facebookis automaatselt. Enne seadistamist kontrollime konto ja vormingu
          nõudeid.
      - text: >-
          Üleandmine: kõik on teie projektis dokumenteeritud ning
          töötab edasi ka siis, kui te meile enam kunagi ei helista.
    example: >-
      Igal esmaspäeva hommikul saabub tarnija hinnakiri PDF-ina. Keegi ei peaks
      seda käsitsi poodi ümber trükkima.
  price:
    unit: / tund
    terms:
      - Kaugteel või kohapeal Slovakkias, Tšehhis, Poolas, Eestis ja Paraguays.
      - Alates ühest tunnist. Esimene sisukas töötuba kestab tavaliselt pool päeva.
      - Koolituskeel on inglise või slovaki keel.
    cta: Broneerige koolitus

