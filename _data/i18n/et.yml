services:
  heading: Mida me teeme
  subheading: >-
    Väike tiim, ilma kliendihalduriteta. Räägite otse nendega, kes koodi
    kirjutavad.
  items:
    - icon: fa-shopping-cart
      title: Veeb ja e-pood
      text: >-
        E-poed ja ärilehed, mis peavad päriselt töötama: tootekataloogid,
        tarnijate hinnakirjade import, tellimused, arved ja e-kiri, mis jõuab
        postkasti, mitte rämpsposti.
    - icon: fa-code
      title: Eritellimustarkvara
      text: >-
        Sisemised töövahendid, liidestused ja see tüütu asi, mida ükski
        valmistoode ei lahenda. Võtame projekte, kus huvitav osa on probleem,
        mitte raamistik.
    - icon: fa-server
      title: DevOps ja hosting
      text: >-
        Juurutused, serverite seadistus, andmebaaside migratsioonid ja e-kiri,
        mis lakkas välja minemast. See tänamatu pool, millest sõltub, kas kõik
        ülejäänu üldse töötab.

training:
  heading: AI-koolitus ja automatiseerimine
  subheading: >-
    Kasutame AI-agente iga päev päris klienditöös. Õpetame sama ka teie
    tiimile ja võtame ära korduva töö, mille peale kulub märkamatult terve
    nädal.
  block1:
    title: Teie tiimi koolitamine
    lead: >-
      Praktiline koolitus teie enda repositooriumi ja teie enda ülesannetega.
      Mitte slaidiesitlus AI tulevikust.
    items:
      - strong: Claude ja Claude Code
        text: >-
          kuidas panna agent tegema päris tööd päris koodibaasis, mitte lihtsalt
          küsimustele vastama.
      - strong: Codex ja OpenCode
        text: milles kumbki tugev on ja millal tasub vahetada.
      - strong: Promptid, projektijuhised ja kontekst
        text: kirjutatud nii, et peavad vastu ka korralikult segases repositooriumis.
      - strong: Agendi töö ülevaatamine
        text: >-
          mida kontrollida enne, kui midagi liidetakse, juurutatakse või
          kliendile saadetakse.
      - strong: Mudelid teie enda riistvaral
        text: juhuks, kui andmed ei tohi majast välja liikuda.
  block2:
    title: Korduva töö automatiseerimine
    lead: >-
      Peaaegu igas ettevõttes on käputäis ülesandeid, mida keegi teeb iga nädal
      uuesti ainult sellepärast, et keegi pole neid seni ette võtnud. Meie
      leiame need üles ja kaotame ära.
    items:
      - text: >-
          Kõigepealt selgitame välja, mida üldse tasub automatiseerida. Päris
          suur osa sellest ei tasu.
      - text: >-
          Agendid ühendatud töövahenditega, mille eest te niikuinii maksate:
          e-post, tabelid, arveldus, teie pood, teie serverid.
      - text: >-
          Ajastatud tööd, mis teevad selle igava osa ära ja annavad märku ainult
          siis, kui midagi on viltu.
      - text: >-
          Üleandmine: kõik on teie repositooriumis ja dokumenteeritud ning
          töötab edasi ka siis, kui te meile enam kunagi ei helista.
    example: >-
      Igal esmaspäeva hommikul saabub tarnija hinnakiri PDF-ina. Keegi ei peaks
      seda käsitsi poodi ümber trükkima.
  price:
    unit: / tund
    vat: Käibemaksuta
    terms:
      - Kaugteel või kohapeal Slovakkias, Tšehhis, Poolas, Eestis ja Paraguays.
      - Alates ühest tunnist. Esimene sisukas töötuba kestab tavaliselt pool päeva.
      - Koolituskeel on inglise või slovaki keel.
      - Eesti ettevõte. EL-i ettevõtetele esitame arve pöördmaksustamisega.
    cta: Broneerige koolitus

