hero:
  kicker: Tarkvaraettevõte · Eesti
  heading_line1: Tarkvara, mis peab
  heading_line2: esmaspäeval töötama
  sub: >-
    Ehitame ja haldame päris ettevõtete produktsioonisüsteeme — e-poode,
    sisemisi tööriistu ja servereid nende all. Väike tiim, ilma
    kliendihaldurite ja piletijärjekorrata.
  cta_work: Vaata meie töid
  cta_contact: Võta ühendust

services:
  heading: Mida me teeme
  subheading: >-
    Väike tiim, ilma kliendihalduriteta. Räägid otse nendega, kes koodi
    kirjutavad.
  items:
    - icon: fa-shopping-cart
      title: Veeb ja e-pood
      text: >-
        E-poed ja ärilehed, mis peavad päriselt töötama: tootekataloogid,
        tarnijate hinnakirjade import, tellimused, arved ja e-kiri, mis jõuab
        postkasti, mitte rämpsposti.
    - icon: fa-code
      title: Eritellimustarkvara
      text: >-
        Sisemised tööriistad, liidestused ja see ebamugav asi, mida ükski
        valmistoode ei lahenda. Võtame projektid, kus huvitav osa on probleem,
        mitte raamistik.
    - icon: fa-server
      title: DevOps ja hosting
      text: >-
        Juurutused, serverite seadistus, andmebaasi migratsioonid ja e-kiri, mis
        lakkas välja minemast. Tänamatu pool, millest sõltub, kas kõik ülejäänu
        püsti püsib.

training:
  heading: AI-koolitus ja automatiseerimine
  subheading: >-
    Kasutame AI-agente iga päev päris kliendide töös. Õpetame sama ka teie
    tiimile — ja võtame ära korduva töö, mis vaikselt teie nädalat sööb.
  block1:
    title: Teie tiimi koolitamine
    lead: >-
      Praktilised sessioonid teie enda repositooriumi ja teie enda ülesannetega.
      Mitte slaidiesitlus AI tulevikust.
    items:
      - strong: Claude ja Claude Code
        text: >-
          — kuidas panna agent tegema päris tööd päris koodibaasis, mitte lihtsalt
          küsimustele vastama.
      - strong: Codex ja OpenCode
        text: >-
          — alternatiivid, milles kumbki hea on ja millal tasub vahetada.
      - strong: Promptid, projektijuhised ja kontekst
        text: mis peavad vastu kohtumisele segase repositooriumiga.
      - strong: Agendi töö ülevaatamine
        text: >-
          — mida kontrollida enne, kui midagi liidetakse, juurutatakse või
          kliendile saadetakse.
      - strong: Mudelid teie enda riistvaral
        text: kui andmed ei tohi majast välja liikuda.
  block2:
    title: Korduva töö automatiseerimine
    lead: >-
      Enamikus ettevõtetes on käputäis ülesandeid, mida keegi teeb iga nädal
      uuesti, sest keegi pole kunagi maha istunud ja neid ära kaotanud. Meie
      leiame need üles ja kaotame ära.
    items:
      - text: >-
          Kõigepealt selgitame välja, mida üldse tasub automatiseerida — märkimisväärset
          osa sellest ei tasu.
      - text: >-
          Agendid ühendatud tööriistadega, mille eest te niikuinii maksate: e-post,
          tabelid, arveldus, teie pood, teie serverid.
      - text: >-
          Ajastatud tööd, mis teevad igava ringi ära ja annavad häält ainult siis,
          kui midagi on viltu.
      - text: >-
          Üleandmine: see elab teie repositooriumis, dokumenteerituna, ja töötab
          edasi ka siis, kui te meile enam kunagi ei helista.
    example: >-
      Igal esmaspäeva hommikul saabub tarnija hinnakiri PDF-ina. Keegi ei peaks
      seda käsitsi poodi ümber trükkima.
  price:
    unit: / tund
    vat: Käibemaksuta
    terms:
      - Kaugteel või kohapeal Slovakkias, Tšehhis, Poolas, Eestis ja Paraguays.
      - Sessioonid alates ühest tunnist. Sisukas esimene töötuba kestab tavaliselt pool päeva.
      - Läbiviimise keel on inglise või slovaki keel.
      - Eesti ettevõte — EL-i ettevõtetele esitame arve pöördmaksustamisega.
    cta: Broneeri koolitus

