launch:
  title: Za čo je 199 € za spustenie
  intro: >-
    Z návrhu a vašich podkladov pripravíme web na spustenie. Táto jednorazová
    práca je oddelená od mesačnej prevádzky a správy.
  items:
    - Prispôsobenie návrhu jednej firme a jednému jazyku.
    - Kontrola dodaných textov, kontaktov a podkladov.
    - Dohodnuté úpravy pred spustením.
    - Kontrola mobilného zobrazenia a dohodnutých kontaktov.
    - Štandardné spustenie na dohodnutej doméne; rozsah presunu potvrdíme vopred.

care:
  title: O web sa postaráme aj po spustení
  body: >-
    Nemusíte hľadať, kto opraví chybu dodaného webu alebo zmení starý kontakt.
    Hosting, HTTPS a technickú správu riešime my. Raz mesačne nám môžete poslať
    jednu drobnú obsahovú zmenu podľa vlastných podkladov.
  limit: >-
    Jedna drobná úprava existujúceho obsahu do 15 minút práce mesačne;
    nevyužitá sa neprenáša. Opravy chýb nami dodaného webu sa do tejto úpravy
    nepočítajú.
  examples_title: Napríklad
  examples:
    - Zmenilo sa telefónne číslo alebo otváracie hodiny, pošlete nové.
    - Máte fotografiu hotovej práce, ktorou chcete nahradiť staršiu.
    - V popise služby je neaktuálna informácia, pošlete opravený text.
  extra_title: Mimo mesačnej správy
  extra:
    - nová stránka alebo nová sekcia,
    - písanie textov od začiatku,
    - nové napojenie alebo funkcia,
    - presun e-mailovej pošty,
    - reklama a platená propagácia.
  extra_note: Takú prácu vám najprv naceníme a začneme až po vašom súhlase.

written_offer:
  title: Čo zapíšeme do písomnej ponuky ešte pred objednávkou
  items:
    - presný zoznam stránok alebo sekcií,
    - termín spustenia,
    - cena práce navyše nad mesačnú úpravu,
    - doména, jej držiteľ a rozsah presunu,
    - podmienky ukončenia služby a výpovedná lehota,
    - odovzdanie súborov pri ukončení,
    - konečná cena a daňový režim.

