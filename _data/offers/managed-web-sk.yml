faq:
  heading: Časté otázky
  items:
    - q: Dostal som e-mail s odkazom na ukážku. Je to naozaj od vás?
      a: >-
        Áno, ak prišiel z adresy končiacej na @skyvault.ee a odkaz vedie na
        ukazka.skyvault.ee. Firmu Skyvault OÜ (registračný kód 14603713, IČ DPH
        EE102117448) si overíte v estónskom obchodnom registri a vo VIES; odkazy
        sú vyššie v časti „Ako si overiť, že píšeme naozaj my“. Heslá ani
        prístupové údaje od vás nikdy nežiadame.
    - q: Čo sa stane s mojím súčasným webom?
      a: >-
        Do potvrdenia písomnej ponuky nič. Beží ďalej na vašom hostingu, my sa
        ho nedotýkame. Pri spustení nového webu ho na vašej doméne nahradíme a
        pôvodné adresy podstránok podľa dohody presmerujeme na nové, aby staré
        odkazy naďalej fungovali.
    - q: Prečo platím aj za spustenie?
      a: >-
        Spustenie je jednorazová práca: prispôsobenie návrhu, kontrola podkladov,
        dohodnuté úpravy a nasadenie na doménu. Mesačná platba pokrýva až
        prevádzku po spustení. Obe sumy uvádzame spolu, aby ste videli celú cenu.
    - q: Čo presne obsahuje mesačná platba?
      a: >-
        Hosting, HTTPS a technickú správu dodaného webu, opravy chýb, ktoré sme
        spôsobili my, a jednu drobnú zmenu existujúceho obsahu do 15 minút práce
        mesačne podľa vašich podkladov.
    - q: Čo ak potrebujem viac úprav?
      a: >-
        Väčšiu úpravu, novú stránku alebo napojenie vám najprv naceníme. Pracovať
        začneme až po vašom súhlase. Cenu práce navyše uvedieme v písomnej
        ponuke.
    - q: Môžem do webu dať vlastné fotky a texty?
      a: >-
        Áno, vlastné fotky sú lepšie než ilustrácie. Fotky z realizácií, logo a
        opravené texty, ktoré pošlete pred spustením, zapracujeme v rámci
        spustenia. Úplne nové texty a nové sekcie naceníme osobitne.
    - q: Koľko stránok bude web mať?
      a: >-
        Závisí od toho, čo potrebujete ukázať. Presný zoznam stránok alebo sekcií
        zapíšeme do ponuky pred objednávkou.
    - q: Ako je to s doménou?
      a: >-
        Doména zostáva vo vašom vlastníctve a platí sa osobitne. Pred presunom
        overíme, na koho je vedená, a v ponuke uvedieme jej držiteľa aj to,
        čo pri presune urobíme.
    - q: Zachováte mi e-mail na doméne?
      a: >-
        Najprv skontrolujeme, ako máte nastavenú doménu a poštu. Presun pošty nie
        je súčasťou bežného rozsahu a nastavenia pošty bez dohody nemeníme.
    - q: Čo sa stane, keď službu ukončím?
      a: >-
        Výpovednú lehotu a to, aké súbory vám odovzdáme, zapíšeme do ponuky ešte
        pred objednávkou, aby ste to vedeli vopred.
    - q: Kedy bude web hotový?
      a: >-
        Termín dohodneme, keď uvidíme vaše podklady, a zapíšeme ho do ponuky.
    - q: Garantujete zákazky alebo pozície v Google?
      a: >-
        Nie. Web zákazníkom uľahčí zistiť, čo robíte, a ozvať sa. Návštevnosť,
        dopyty ani pozície vo vyhľadávaní negarantujeme.
    - q: Prečo fakturuje estónska firma a ako je to s DPH?
      a: >-
        Dodávateľom je Skyvault OÜ, firma registrovaná v Estónsku. Faktúru
        vystavíme bez pripočítanej DPH. Ak je vaša firma platiteľom DPH, DPH si
        priznáte na Slovensku a pri plnom nároku na odpočet vám z tejto služby
        nevznikne ďalší náklad na DPH. Ak platiteľom nie ste, pri službe od
        zahraničného dodávateľa vzniká povinnosť registrácie podľa § 7a zákona o
        DPH a DPH odvediete sami. Daňový režim a konečnú cenu pre vašu firmu
        uvedieme v písomnej ponuke.

