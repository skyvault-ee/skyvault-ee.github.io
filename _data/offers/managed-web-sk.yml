# Prečo: ako vyzerá starší web na telefóne. Čísla len z verejného zdroja
# (StatCounter, Slovensko, Desktop vs Mobile, mesačné hodnoty 9/2025 – 9/2026).
mobile:
  heading: Ako vidí váš web zákazník na mobile
  intro: >-
    Približne polovica návštev slovenských webov je dnes z mobilu (StatCounter,
    9/2025 – 9/2026: 47 až 59 % mesačne). Starší web bez mobilnej verzie sa na
    telefóne zobrazí ako zmenšená verzia stránky pre počítač: písmo je drobné,
    treba si ho zväčšovať prstami, a telefónne číslo je tam uvedené len ako
    text, nedá sa naň ťuknúť a zavolať.
  old_label: "Dnes: web bez mobilnej verzie"
  old_alt: >-
    Starší web na telefóne: celá počítačová stránka zmenšená na tretinu, text
    je nečitateľný a pod obsahom je prázdne miesto.
  new_label: "Nový web: prispôsobený telefónu"
  new_alt: >-
    Nový web na telefóne: čitateľný nadpis, krátky popis služieb a tlačidlo
    na zavolanie hneď v úvode.
  old_title: Dnes, s telefónom v ruke
  old_steps:
    - Zákazník otvorí web a vidí zmenšenú stránku. Musí si ju zväčšovať prstami a posúvať do strán.
    - Nájde číslo a ručne si ho prepíše do telefónu.
    - Alebo stránku zavrie a skúsi ďalšiu firmu vo výsledkoch vyhľadávania.
  new_title: Na webe prispôsobenom telefónu
  new_steps:
    - Otvorí web a hneď vidí, čo robíte a kde.
    - Jedným ťuknutím vám zavolá alebo pošle dopyt.
  check_title: Overte si to na vlastnom webe
  check: >-
    Otvorte svoj web na telefóne. Ak si musíte text zväčšovať a na číslo sa nedá
    ťuknúť, ide presne o tento prípad. Firmám, ktorým posielame ukážku,
    prikladáme aj PDF s porovnaním ich webu a ukážky: snímky z telefónu
    a počítača a namerané hodnoty.
  source: >-
    Zdroj podielu mobilu: gs.statcounter.com, Slovensko, platforma Desktop vs
    Mobile vs Tablet. Koľko návštev z mobilu má konkrétny web, z verejných
    údajov nevidno.

# Pre firmy, ktorým sme poslali e-mail so súkromným odkazom na ukážku.
preview:
  heading: Dostali ste od nás e-mail s ukážkou?
  intro: >-
    Firmám, ktorých web sme si pozreli na mobile, posielame súkromný odkaz na
    ukážku nového webu pripravenú z ich vlastných textov a fotiek. Vysvetľujeme,
    čo to znamená a čo s tým môžete urobiť.
  items:
    - title: Váš súčasný web sa nemení.
      text: >-
        Ukážka beží na našej adrese ukazka.skyvault.ee. Na vašej doméne,
        hostingu ani pošte sme nič neupravovali a bez písomnej objednávky ani
        neupravíme.
    - title: Odkaz je súkromný.
      text: >-
        Vedie len na ukážku pre vašu firmu. Nie je vo vyhľadávačoch ani v
        žiadnom verejnom zozname. Pokojne ho prepošlite kolegom alebo
        spoločníkovi.
    - title: Kontakty a formulár sú v ukážke simulované.
      text: >-
        Z ukážky sa nedá omylom zavolať ani odoslať dopyt. Na spustenom webe sa
        bude dať na číslo ťuknúť a dopyt príde na váš e-mail.
    - title: Texty a fotky sú z vášho webu.
      text: >-
        Čo sme na vašom webe nenašli, nahradili sme ilustráciami a označili.
        Pred spustením ich vymeníme za vaše fotky z realizácií.
    - title: Tlačidlo „3 úpravy zadarmo“.
      text: >-
        Napíšte, čo chcete zmeniť: titulok, texty, farby alebo fotky. Tri úpravy
        ukážky urobíme pred vaším rozhodnutím, bez platby a bez záväzku.
    - title: Tlačidlo „Chcem tento web“.
      text: >-
        Nezáväzný záujem, nie objednávka. Ozveme sa, dohodneme rozsah a pošleme
        písomnú ponuku. Nič sa neúčtuje, kým ju nepotvrdíte.
    - title: Nemáte záujem?
      text: >-
        Odpíšte na e-mail „NIE“. Ukážku odstránime a viac sa neozveme.
  verify_title: Ako si overiť, že píšeme naozaj my
  verify:
    - E-mail prichádza z adresy končiacej na @skyvault.ee a ukážka je na adrese začínajúcej na ukazka.skyvault.ee.
    - Dodávateľom je spoločnosť Skyvault OÜ, registračný kód 14603713, zapísaná v estónskom obchodnom registri.
    - IČ DPH EE102117448 si overíte v systéme VIES Európskej komisie.
    - Alebo nám jednoducho zavolajte na +421 940 900 565. Ozve sa Alexander Sádovský, ktorý ukážku pripravil.
  register_link: Obchodný register (ariregister.rik.ee)
  vies_link: Overenie IČ DPH (VIES)

