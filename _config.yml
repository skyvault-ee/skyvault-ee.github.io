url: "https://www.skyvault.ee"
baseurl: ""

# Site settings
title: Skyvault
email: alino.sadovsky@skyvault.ee
description: "Skyvault builds company websites and online shops, designs logos and brand identities, runs SEO audits, and automates marketing with AI. We also build custom software and keep the systems behind a business running. Estonian company, serving EU clients."
lang: en

# Team names, titles and social links
people:
- name: Alexander Sadovsky
  pic: 1
  position: CEO & Software developer

- name: Ernest Sitko
  pic: 2
  position: Devops coordinator

# Company profiles. jekyll-seo-tag turns social.links into schema.org sameAs on
# the homepage; the footer renders the same list, so the two can't drift apart.
social:
  name: Skyvault
  links:
    - https://www.facebook.com/skyvault.ee/
    - https://www.instagram.com/skyvault.ee/


# Build settings
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .hermes
  - node_modules
  - package.json
  - package-lock.json
  - playwright.config.cjs
  - tests
  - test-results
  - playwright-report
  - scripts
  - assets/css/source.css
  # Untracked draft: placeholder specialists and a 2019 job offer. Not for production.
  - specialists.markdown
  - _layouts/outsourcing.html
  - _includes/outsourcing

defaults:
  - scope:
      path: "send_cv.markdown"
    values:
      sitemap: false
