<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <!-- Skyvault hero backdrop: the logo's vault dome, drawn as concentric
       meridians springing from the bottom edge, so the section boundary
       reads as the horizon. Deliberately geometric — no stock photography. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#03151f"/>
      <stop offset="62%"  stop-color="#07314a"/>
      <stop offset="100%" stop-color="#041d2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="66%">
      <stop offset="0%"   stop-color="#007eb0" stop-opacity=".42"/>
      <stop offset="55%"  stop-color="#007eb0" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#007eb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4fc3f7" stop-opacity=".00"/>
      <stop offset="42%"  stop-color="#4fc3f7" stop-opacity=".50"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="fadeGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2ba22e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2ba22e" stop-opacity=".70"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- dome: outer shell, springing from the bottom edge -->
  <g fill="none" stroke="url(#fade)" stroke-width="2.5">
    <path d="M 276 900 A 524 524 0 0 1 1324 900"/>
  </g>

  <!-- meridians, mirrored inward -->
  <g fill="none" stroke="url(#fade)" stroke-opacity=".60" stroke-width="1.5">
    <path d="M 276 900 A 524 312 0 0 1 1324 900"/>
    <path d="M 276 900 A 524 174 0 0 1 1324 900"/>
    <path d="M 276 900 A 524 56  0 0 1 1324 900"/>
  </g>

  <!-- inner dome, echoing the mark's double arc -->
  <g fill="none" stroke="url(#fadeGreen)" stroke-width="1.5">
    <path d="M 458 900 A 342 342 0 0 1 1142 900"/>
    <path d="M 458 900 A 342 134 0 0 1 1142 900"/>
  </g>

  <!-- apex -->
  <line x1="800" y1="376" x2="800" y2="900" stroke="url(#fade)" stroke-opacity=".30" stroke-width="1.5"/>
  <circle cx="800" cy="376" r="4" fill="#4fc3f7" fill-opacity=".9"/>

  <!-- faint field of stars, hand-placed so it doesn't read as noise -->
  <g fill="#9fdcf5">
    <circle cx="180"  cy="120" r="1.6" fill-opacity=".55"/>
    <circle cx="1420" cy="96"  r="1.9" fill-opacity=".45"/>
    <circle cx="1180" cy="210" r="1.3" fill-opacity=".40"/>
    <circle cx="420"  cy="252" r="1.5" fill-opacity=".35"/>
    <circle cx="1520" cy="380" r="1.4" fill-opacity=".30"/>
    <circle cx="96"   cy="430" r="1.7" fill-opacity=".33"/>
    <circle cx="700"  cy="88"  r="1.2" fill-opacity=".45"/>
    <circle cx="960"  cy="150" r="1.5" fill-opacity=".38"/>
  </g>
</svg>
